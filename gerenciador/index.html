<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Login | Gerenciador — a luz invisível</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/gerenciador.css">
</head>
<body>

  <div class="login-screen">
    <div class="login-box">
      <img src="../img/logo-branco.svg" alt="a luz invisível">
      <h1>Área do gerenciador</h1>

      <form id="login-form" novalidate>
        <input type="email" name="email" placeholder="E-mail" autocomplete="username" required>
        <input type="password" name="senha" placeholder="Senha" autocomplete="current-password" required>
        <p class="login-error" id="login-error"></p>
        <button type="submit">Entrar</button>
        <a class="login-link" href="esqueci-senha.html">Esqueci minha senha</a>
      </form>
    </div>
  </div>

  <script src="../js/data/portfolio-data.js"></script>
  <script src="js/api.js"></script>
  <script>
    const form = document.getElementById('login-form');
    const errorEl = document.getElementById('login-error');

    if (Api.currentUser()) {
      window.location.href = 'dashboard.html';
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      errorEl.textContent = '';

      try {
        Api.login(form.email.value.trim(), form.senha.value);
        window.location.href = 'dashboard.html';
      } catch (err) {
        errorEl.textContent = err.message;
      }
    });
  </script>

</body>
</html>
