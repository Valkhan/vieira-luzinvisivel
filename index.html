<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ali Tapume</title>
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    /* ─── CARROSSEL ─── */
    #carousel {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    .slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 1.2s ease-in-out;
    }

    .slide.active {
      opacity: 1;
    }

    .slide img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      /* object-position é definida via JS a cada ciclo */
    }

    /* Véu escuro para legibilidade da identidade */
    #veil {
      position: fixed;
      inset: 0;
      z-index: 1;
      background: rgba(0, 0, 0, 0.30);
      pointer-events: none;
    }

    /* ─── IDENTIDADE CENTRAL ─── */
    #logo-wrapper {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      animation: fadeIn 1.8s ease forwards;
    }

    #logo {
      width: 92vw;
      aspect-ratio: 670 / 740;
      display: block;
    }

    @media (min-aspect-ratio: 1/1) {
      #logo {
        width: 72vh;
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- Carrossel de fundo -->
  <div id="carousel">
    <div class="slide"><img alt=""></div>
    <div class="slide"><img alt=""></div>
    <div class="slide"><img alt=""></div>
  </div>

  <!-- Véu escuro -->
  <div id="veil"></div>

  <!-- Identidade centralizada -->
  <div id="logo-wrapper">
    <object id="logo" data="img/pensando_tapume_info.svg" type="image/svg+xml"></object>
  </div>

  <script>
    (() => {
      /* ── Sorteio de categoria ── */
      const categorias = ['etereo', 'mineral', 'pele'];
      const categoria  = categorias[Math.floor(Math.random() * categorias.length)];

      /* ── Posições aleatórias para object-position ── */
      const posicoes = [
        '15% 15%', '50% 15%', '85% 15%',
        '15% 50%', '50% 50%', '85% 50%',
        '15% 85%', '50% 85%', '85% 85%',
      ];

      function posAleatoria() {
        return posicoes[Math.floor(Math.random() * posicoes.length)];
      }

      /* ── Embaralha ordem das 3 imagens ── */
      const ordem = [1, 2, 3].sort(() => Math.random() - 0.5);
      const slides = document.querySelectorAll('.slide');

      slides.forEach((slide, i) => {
        const img = slide.querySelector('img');
        img.src = `img/fundos/ali_tapume_${categoria}_0${ordem[i]}.jpg`;
        img.style.objectPosition = posAleatoria();
      });

      /* ── Inicia o carrossel após o fadeIn da identidade ── */
      let atual = 0;

      setTimeout(() => {
        slides[atual].classList.add('active');

        setInterval(() => {
          slides[atual].classList.remove('active');
          atual = (atual + 1) % slides.length;

          /* Nova posição aleatória a cada entrada */
          slides[atual].querySelector('img').style.objectPosition = posAleatoria();
          slides[atual].classList.add('active');
        }, 3000);
      }, 300); /* fundo preto mínimo (~0.3s) — carrossel entra antes do fadeIn terminar */
    })();
  </script>

</body>
</html>
