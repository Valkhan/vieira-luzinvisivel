<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ali Tapume</title>
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    /* ─── CARROSSEL ─── */
    #carousel {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    .slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 1.2s ease-in-out;
    }

    .slide.active {
      opacity: 1;
    }

    .slide img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      /* object-position é definida via JS a cada ciclo */
    }

    /* Véu escuro para legibilidade da identidade */
    #veil {
      position: fixed;
      inset: 0;
      z-index: 1;
      background: rgba(0, 0, 0, 0.30);
      pointer-events: none;
    }

    /* ─── IDENTIDADE CENTRAL ─── */
    #logo-wrapper {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      animation: fadeIn 1.8s ease forwards;
    }

    #logo {
      width: 92vw;
      aspect-ratio: 670 / 760;
      display: block;
    }

    @media (min-aspect-ratio: 1/1) {
      #logo {
        width: 72vh;
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- Carrossel de fundo -->
  <div id="carousel">
    <div class="slide"><img alt=""></div>
    <div class="slide"><img alt=""></div>
    <div class="slide"><img alt=""></div>
  </div>

  <!-- Véu escuro -->
  <div id="veil"></div>

  <!-- Identidade centralizada -->
  <div id="logo-wrapper">
    <object id="logo" data="img/pensando_tapume_info.svg" type="image/svg+xml"></object>
  </div>

  <script>
    (() => {
      /* ── Todas as 9 imagens de fundo ── */
      const todasImagens = [
        'img/fundos/ali_tapume_etereo_01.jpg',
        'img/fundos/ali_tapume_etereo_02.jpg',
        'img/fundos/ali_tapume_etereo_03.jpg',
        'img/fundos/ali_tapume_mineral_01.jpg',
        'img/fundos/ali_tapume_mineral_02.jpg',
        'img/fundos/ali_tapume_mineral_03.jpg',
        'img/fundos/ali_tapume_pele_01.jpg',
        'img/fundos/ali_tapume_pele_02.jpg',
        'img/fundos/ali_tapume_pele_03.jpg',
      ];

      /* Fisher-Yates */
      function embaralhar(arr) {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      /* Fila com re-embaralhamento automático ao esgotar */
      let fila = embaralhar(todasImagens);
      let cursor = 0;

      function proximaImagem() {
        if (cursor >= fila.length) {
          fila = embaralhar(todasImagens);
          cursor = 0;
        }
        return fila[cursor++];
      }

      /* ── Posições aleatórias para object-position ── */
      const posicoes = [
        '15% 15%', '50% 15%', '85% 15%',
        '15% 50%', '50% 50%', '85% 50%',
        '15% 85%', '50% 85%', '85% 85%',
      ];

      function posAleatoria() {
        return posicoes[Math.floor(Math.random() * posicoes.length)];
      }

      /* ── Inicializa os 3 slides com as primeiras imagens da fila ── */
      const slides = document.querySelectorAll('.slide');

      slides.forEach(slide => {
        const img = slide.querySelector('img');
        img.src = proximaImagem();
        img.style.objectPosition = posAleatoria();
      });

      /* ── Carrossel ── */
      let atual = 0;

      setTimeout(() => {
        slides[atual].classList.add('active');

        setInterval(() => {
          const anterior = atual;
          slides[anterior].classList.remove('active');
          atual = (atual + 1) % slides.length;
          slides[atual].querySelector('img').style.objectPosition = posAleatoria();
          slides[atual].classList.add('active');

          /* Recarrega o slot que acabou de sair com a próxima da fila */
          setTimeout(() => {
            const img = slides[anterior].querySelector('img');
            img.src = proximaImagem();
            img.style.objectPosition = posAleatoria();
          }, 1500);
        }, 3000);
      }, 300);
    })();
  </script>

</body>
</html>
