  <script>
    /*
     * iOS Safari expande/recolhe a barra de endereço e a barra inferior
     * durante o scroll, então vh/dvh/svh/lvh puros nunca refletem com
     * precisão a altura visível real em todos os momentos. Medimos
     * window.innerHeight via JS e guardamos em --vh, atualizando sempre
     * que a UI do navegador mudar de estado.
     */
    (function () {
      function setVH() {
        document.documentElement.style.setProperty('--vh', window.innerHeight + 'px');
      }
      setVH();
      window.addEventListener('resize', setVH);
      window.addEventListener('orientationchange', setVH);
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', setVH);
      }
    })();
  </script>
